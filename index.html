<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coordinate degli scacchi</title>
<style>
:root{--bg:#262421;--panel:#312e2b;--panel2:#3d3935;--text:#f0efed;--muted:#a7a5a1;--accent:#81b64c;--red:#e5534b;--sqL:#ebecd0;--sqD:#739552;--hl:#f6f669;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
h1{font-size:20px;margin:0 0 12px;grid-column:1/-1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:var(--panel);color:var(--muted);border:0;border-radius:8px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:14px;color:var(--muted)}
.opts select{background:var(--panel2);color:var(--text);border:0;border-radius:6px;padding:6px 8px;font-size:14px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.prompt{display:flex;align-items:center;gap:14px;min-height:64px;margin-bottom:12px;flex-wrap:wrap}
.coord{font-size:38px;font-weight:800;min-width:92px;text-align:center;padding:4px 14px;border-radius:10px;letter-spacing:1px}
.coord{background:#85827e}
.coord.w{color:#fff}
.coord.b{color:#000}
.side{color:var(--muted);font-size:14px}
#ans{display:none;width:110px;font-size:32px;font-weight:800;text-align:center;background:var(--panel2);color:var(--text);border:2px solid #555;border-radius:10px;padding:4px 8px;text-transform:lowercase}
#ans.w{background:#fff;color:#000;border-color:#fff}
#ans.b{background:#000;color:#fff;border-color:#000}
#ans:focus{outline:0;border-color:var(--accent)}
#wrong{color:var(--red);font-size:22px;font-weight:700;min-width:50px}
.boardwrap{width:min(100%,calc(100vh - 230px),640px);min-width:260px}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none}
.sq{position:relative;cursor:pointer;display:flex}
.sq.l{background:var(--sqL)}.sq.d{background:var(--sqD)}
.sq.hl::after,.sq.ok::after,.sq.bad::after{content:"";position:absolute;inset:0;pointer-events:none}
.sq.hl::after{background:rgba(246,246,105,.85)}
.sq.ok::after{background:rgba(129,182,76,.9)}
.sq.bad::after{background:rgba(229,83,75,.85)}
.lab{position:absolute;font-size:clamp(9px,1.8vw,13px);font-weight:700;z-index:2;pointer-events:none}
.l .lab{color:var(--sqD)}.d .lab{color:var(--sqL)}
.lab.r{top:3px;left:4px}.lab.f{bottom:2px;right:4px}
.panel{background:var(--panel);border-radius:10px;padding:14px;align-self:start}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--panel2);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.panel h2{font-size:14px;color:var(--muted);margin:6px 0 8px;font-weight:600}
#list{display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow:auto}
.chip{padding:3px 9px;border-radius:6px;font-size:14px;font-weight:700}
.chip.w{background:#f0efed;color:#111}.chip.b{background:#161512;color:#f0efed;border:1px solid #555}
.reset{margin-top:12px;width:100%;background:var(--panel2);color:var(--text);border:0;border-radius:8px;padding:10px;font-size:14px;cursor:pointer}
@media(max-width:820px){.app{grid-template-columns:1fr}.boardwrap{width:100%}}
.sq{-webkit-tap-highlight-color:transparent}
.mobile,.mobile *{touch-action:manipulation}
.mobile .app{padding:8px 8px 16px;gap:12px;grid-template-columns:1fr}
.mobile h1{font-size:17px;margin-bottom:0}
.mobile .tabs{margin-bottom:8px}
.mobile .tab{flex:1;padding:12px 6px;font-size:14px}
.mobile .opts{gap:10px;margin-bottom:8px;font-size:13px}
.mobile .prompt{min-height:52px;margin-bottom:8px;gap:10px}
.mobile .coord{font-size:34px}
.mobile #ans{font-size:30px;width:100px}
.mobile .boardwrap{width:100%;min-width:0;margin:0 auto}
.mobile .board{border-radius:4px}
.mobile.typing h1{display:none}
.mobile.typing .boardwrap{width:min(100%,calc(var(--vh,100vh) - 330px));min-width:150px}
.kb{display:none;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.mobile.typing .kb{display:grid}
.kb button{background:var(--panel2);color:var(--text);border:0;border-radius:8px;padding:14px 0;font-size:22px;font-weight:700;cursor:pointer}
.kb button:active{background:var(--accent)}
.kb button.n.off{opacity:.3}
@keyframes blink{50%{border-color:var(--accent)}}
.mobile #ans[readonly]{animation:blink 1.1s infinite}
.mobile #list{max-height:120px}
.mobile .panel{padding:10px}
.gear{margin-left:auto;background:var(--panel);color:var(--muted);border:0;border-radius:50%;width:32px;height:32px;font-size:17px;line-height:1;cursor:pointer}
.set{display:none;background:var(--panel);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:14px;color:var(--muted);align-items:center;gap:8px}
.set.on{display:flex}
.set select{background:var(--panel2);color:var(--text);border:0;border-radius:6px;padding:6px 8px;font-size:14px}
</style>
</head>
<body>
<div class="app">
<h1>♞ Coordinate della scacchiera</h1>
<section>
  <div class="tabs">
    <button class="tab on" data-m="find">Trova la casella</button>
    <button class="tab" data-m="type">Scrivi la coordinata</button>
  </div>
  <div class="opts">
    <label>Lato
      <select id="side"><option value="r">Casuale</option><option value="w">Bianco</option><option value="b">Nero</option></select>
    </label>
    <label><input type="checkbox" id="labels"> Mostra le coordinate sul bordo</label>
    <button class="gear" id="gear" type="button" aria-label="Impostazioni" title="Impostazioni">⚙</button>
  </div>
  <div class="set" id="set">
    <label for="view">Versione</label>
    <select id="view"><option value="auto">Automatica</option><option value="desktop">Desktop</option><option value="mobile">Mobile</option></select>
  </div>
  <div class="prompt">
    <div class="coord w" id="coord">e4</div>
    <input id="ans" type="text" maxlength="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Coordinata">
    <div id="wrong"></div>
    <div class="side" id="sideLbl"></div>
  </div>
  <div class="boardwrap"><div class="board" id="board"></div></div>
  <div class="kb" id="kb"></div>
</section>
<aside class="panel">
  <div class="stats">
    <div class="stat"><b id="sOk">0</b><span>Corrette</span></div>
    <div class="stat"><b id="sErr">0</b><span>Errori</span></div>
    <div class="stat"><b id="sAcc">–</b><span>Precisione</span></div>
  </div>
  <h2>Coordinate indovinate</h2>
  <div id="list"></div>
  <button class="reset" id="reset">Azzera sessione</button>
</aside>
</div>
<script>
(function(){
var F='abcdefgh';
var mode='find',sideSet='r',side='w',target='',prev='',ok=0,err=0,found=[],locked=false;
var $=function(i){return document.getElementById(i)};
var board=$('board'),coord=$('coord'),ans=$('ans'),wrong=$('wrong');

function rnd(){var s;do{s=F[Math.floor(Math.random()*8)]+(1+Math.floor(Math.random()*8))}while(s===prev);return s}

function build(){
  board.innerHTML='';
  var showL=$('labels').checked;
  for(var row=0;row<8;row++)for(var col=0;col<8;col++){
    var fi=side==='w'?col:7-col, r=side==='w'?8-row:row+1;
    var d=document.createElement('div');
    d.className='sq '+(((fi+r)%2===1)?'d':'l');
    d.dataset.sq=F[fi]+r;
    if(showL){
      if(col===0){var a=document.createElement('span');a.className='lab r';a.textContent=r;d.appendChild(a)}
      if(row===7){var b=document.createElement('span');b.className='lab f';b.textContent=F[fi];d.appendChild(b)}
    }
    board.appendChild(d);
  }
}
function sqEl(s){return board.querySelector('[data-sq="'+s+'"]')}

function next(){
  prev=target;target=rnd();document.documentElement.classList.toggle('typing',mode==='type');
  side=sideSet==='r'?(Math.random()<.5?'w':'b'):sideSet;
  build();wrong.textContent='';
  $('sideLbl').textContent='Giochi con il '+(side==='w'?'Bianco':'Nero');
  if(mode==='find'){
    coord.style.display='';coord.textContent=target;coord.className='coord '+side;
    ans.style.display='none';
  }else{
    coord.style.display='none';ans.style.display='block';ans.className=side;ans.value='';ans.readOnly=root.classList.contains('mobile');kbState();
    sqEl(target).classList.add('hl');ans.focus();
  }
}
function correct(){
  ok++;found.unshift({s:target,c:side});stats();renderList();
}
function stats(){
  $('sOk').textContent=ok;$('sErr').textContent=err;
  $('sAcc').textContent=(ok+err)?Math.round(ok/(ok+err)*100)+'%':'–';
}
function renderList(){
  $('list').innerHTML=found.map(function(x){return '<span class="chip '+x.c+'">'+x.s+'</span>'}).join('');
}

board.addEventListener('click',function(e){
  if(mode!=='find'||locked)return;
  var el=e.target.closest('.sq');if(!el)return;
  if(el.dataset.sq===target){
    locked=true;el.classList.add('ok');correct();
    setTimeout(function(){locked=false;next()},220);
  }else{
    err++;stats();el.classList.add('bad');
    setTimeout(function(){el.classList.remove('bad')},450);
  }
});

ans.addEventListener('input',function(){
  var v=ans.value.trim().toLowerCase();
  if(v.length<2)return;
  var old=board.querySelector('.bad');if(old)old.classList.remove('bad');
  if(v===target){correct();next();return}
  err++;stats();
  var el=/^[a-h][1-8]$/.test(v)?sqEl(v):null;
  if(el)el.classList.add('bad');
  wrong.textContent=v;
  ans.value='';ans.focus();
});

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    t.classList.add('on');mode=t.dataset.m;next();
  });
});
$('side').addEventListener('change',function(){sideSet=this.value;next()});
$('labels').addEventListener('change',function(){
  build();var h=sqEl(target);if(h&&mode==='type')h.classList.add('hl');
});
$('reset').addEventListener('click',function(){ok=0;err=0;found=[];stats();renderList();next()});

var root=document.documentElement;
var kb=$('kb');
function kbState(){
  var on=/^[a-h]$/.test(ans.value);
  kb.querySelectorAll('.n').forEach(function(b){b.classList.toggle('off',!on)});
}
function press(ch){
  var v=ans.value;
  if(/[a-h]/.test(ch)){ans.value=ch}
  else{
    if(!/^[a-h]$/.test(v))return;
    ans.value=v+ch;ans.dispatchEvent(new Event('input'));
  }
  kbState();
}
'abcdefgh12345678'.split('').forEach(function(ch){
  var b=document.createElement('button');b.type='button';b.textContent=ch;
  if(/\d/.test(ch))b.className='n';
  b.addEventListener('click',function(){press(ch)});
  kb.appendChild(b);
});
function detect(){
  var w=window.innerWidth;
  var auto=w<=820||(matchMedia('(pointer:coarse)').matches&&w<=1024);
  var m=view==='mobile'?true:view==='desktop'?false:auto;
  root.classList.toggle('mobile',m);
  ans.readOnly=m;
  root.style.setProperty('--vh',(window.visualViewport?visualViewport.height:window.innerHeight)+'px');
}
var view='auto';
try{view=localStorage.getItem('coordView')||'auto'}catch(e){}
$('view').value=view;
$('gear').addEventListener('click',function(){$('set').classList.toggle('on')});
$('view').addEventListener('change',function(){
  view=this.value;
  try{localStorage.setItem('coordView',view)}catch(e){}
  detect();
});
detect();
window.addEventListener('resize',detect);
if(window.visualViewport)visualViewport.addEventListener('resize',detect);
next();
})();
</script>
</body>
</html>
